<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amenity Reservations</title>
  <base href="/run/amenity-reservations/" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #374151);
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
    }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg); color: var(--text);
      min-height: 100vh; font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 640px; margin: 0 auto; padding: 16px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; padding: 14px 18px;
      background: var(--accent); border-radius: var(--radius); color: white;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1px; }
    header .sub { font-size: 0.75rem; opacity: .7; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary  { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .btn-ghost    { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--text); color: var(--text); }
    .btn-danger   { background: #dc2626; color: white; }
    .btn-danger:hover:not(:disabled) { opacity: .88; }
    .btn-success  { background: #16a34a; color: white; }
    .btn-success:hover:not(:disabled) { opacity: .88; }
    .btn-icon     { background: rgba(255,255,255,.2); color: white; border: none; font-size: 1rem; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    .btn-icon:hover { background: rgba(255,255,255,.3); }
    .btn-sm       { padding: 5px 12px; font-size: 0.8rem; }

    .tabs {
      display: flex; gap: 4px; margin-bottom: 16px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 4px;
    }
    .tab {
      flex: 1; padding: 7px 6px; border-radius: calc(var(--radius) - 2px);
      border: none; background: transparent;
      font-size: 0.82rem; font-weight: 600; cursor: pointer; color: var(--muted); transition: all .15s;
      white-space: nowrap;
    }
    .tab.active { background: var(--accent); color: var(--accent-fg); }
    .tab:hover:not(.active) { color: var(--text); }
    .badge-count {
      display: inline-flex; align-items: center; justify-content: center;
      width: 17px; height: 17px; border-radius: 50%;
      font-size: 0.68rem; font-weight: 700; background: #ef4444; color: white; margin-left: 4px;
    }

    .card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      box-shadow: var(--shadow); margin-bottom: 12px;
    }

    .amenity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 4px; }
    .amenity-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      box-shadow: var(--shadow); cursor: pointer; transition: border-color .15s, box-shadow .15s;
      display: flex; flex-direction: column; gap: 5px;
    }
    .amenity-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .amenity-icon { font-size: 2rem; line-height: 1.1; }
    .amenity-name { font-weight: 700; font-size: 0.95rem; }
    .amenity-loc  { font-size: 0.78rem; color: var(--muted); }
    .amenity-avail { font-size: 0.78rem; font-weight: 600; margin-top: 3px; }
    .avail-ok     { color: #16a34a; }
    .avail-limited { color: #d97706; }
    .avail-full   { color: #dc2626; }

    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 12px;
      font-size: 0.78rem; font-weight: 600; white-space: nowrap;
    }
    .badge-green  { background: #dcfce7; color: #166534; }
    .badge-yellow { background: #fef9c3; color: #854d0e; }
    .badge-red    { background: #fee2e2; color: #991b1b; }
    .badge-gray   { background: #f3f4f6; color: #4b5563; }
    .badge-blue   { background: #dbeafe; color: #1e40af; }

    .res-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 10px; }
    .res-top  { display: flex; align-items: flex-start; gap: 12px; }
    .res-icon { font-size: 1.5rem; flex-shrink: 0; line-height: 1.3; }
    .res-info { flex: 1; min-width: 0; }
    .res-name { font-weight: 700; font-size: 0.92rem; }

    .res-footer { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .res-notes  { font-size: 0.8rem; color: var(--muted); margin-top: 6px; font-style: italic; }

    .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: white; flex-shrink: 0; }

    .back-btn { background: none; border: none; cursor: pointer; font-size: 0.82rem; color: var(--muted); padding: 0; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 4px; }
    .back-btn:hover { color: var(--text); }

    .detail-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 10px; }
    .detail-icon   { font-size: 2.4rem; line-height: 1; flex-shrink: 0; }
    .detail-title  { font-size: 1.15rem; font-weight: 700; }
    .detail-meta   { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .detail-desc   { font-size: 0.88rem; color: var(--muted); margin-top: 8px; }

    .rules-box { background: #f9fafb; border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; margin: 12px 0 0; font-size: 0.82rem; }

    .rules-row { display: flex; gap: 6px; margin-bottom: 3px; }
    .rules-row:last-child { margin-bottom: 0; }

    .date-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .date-nav-btn { background: var(--card); border: 1.5px solid var(--border); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 0.95rem; color: var(--text); transition: border-color .15s; }

    .date-nav-btn:disabled { opacity: .4; cursor: default; }
    .date-label { font-weight: 700; font-size: 0.92rem; flex: 1; text-align: center; }
    .date-input-row { margin-bottom: 12px; }
    .date-input { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 0.9rem; font-family: inherit; outline: none; background: white; }
    .date-input:focus { border-color: var(--accent); }

    .timeline { border-top: 1px solid var(--border); }
    .timeline-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .timeline-time { font-size: 0.8rem; color: var(--muted); width: 110px; flex-shrink: 0; }
    .timeline-empty { font-size: 0.85rem; color: var(--muted); padding: 14px 0; text-align: center; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
    .form-group input, .form-group select, .form-group textarea {

      padding: 8px 12px; font-size: 0.9rem; outline: none; transition: border-color .15s;

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }

    .form-row { display: flex; gap: 10px; }

    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }

    .modal-actions .btn { flex: 1; justify-content: center; min-width: 90px; }
    .error-msg { color: #dc2626; font-size: 0.82rem; margin-top: 6px; min-height: 18px; }

    /* Outlook-style day-timeline picker */
    .bk-readout { font-size: 0.85rem; margin-bottom: 8px; font-weight: 600; }
    .bk-readout.muted { color: var(--muted); font-weight: 500; }
    .bk-readout.ok   { color: #16a34a; }
    .bk-readout.bad  { color: #dc2626; }
    .bk-grid {
      border: 1px solid var(--border); border-radius: 8px;
      max-height: 300px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .bk-slot {
      display: flex; align-items: stretch; width: 100%; padding: 0;
      border: none; border-bottom: 1px solid var(--border);
      background: var(--card); color: inherit; font: inherit;
      text-align: left; cursor: pointer; min-height: 34px;
    }
    .bk-slot:last-child { border-bottom: none; }
    .bk-slot-time {
      width: 78px; flex-shrink: 0; padding: 7px 8px;
      color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums;
      border-right: 1px solid var(--border);
    }
    .bk-slot-body {
      flex: 1; min-width: 0; padding: 7px 10px;
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;

    .bk-slot.free:hover { background: #f3f4f6; }
    .bk-slot.sel { background: var(--accent); }
    .bk-slot.sel .bk-slot-time { color: var(--accent-fg); opacity: .8; border-right-color: rgba(255,255,255,.25); }
    .bk-slot.sel .bk-slot-body { color: var(--accent-fg); font-weight: 600; }

    .bk-slot.partial .bk-slot-body { color: #c2410c; }

    .bk-slot.full .bk-slot-body { color: var(--muted); }
    .bk-pick-hint { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .bk-pick-hint .link-btn {
      background: none; border: none; color: var(--accent); font-size: 0.78rem;

    .admin-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .admin-row:last-child { border-bottom: none; }
    .admin-row-icon { font-size: 1.4rem; flex-shrink: 0; }

    .admin-row-name { font-weight: 700; font-size: 0.9rem; }
    .admin-row-meta { font-size: 0.78rem; color: var(--muted); margin-top: 1px; }
    .admin-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .pending-actions { display: flex; gap: 8px; margin-top: 10px; }
    .member-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .date-group-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 8px; }
    .date-group-label:first-child { margin-top: 0; }

    .empty   { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 0.9rem; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);

    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }

<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>
<script type="module">
import { memberColor, initial, esc, isAdult, hubConfirm, createDbHelper, searchMatch, hubToday as todayStr } from "/hub-sdk.js";
import {
  isBoard as _isBoard, timesToMinutes, durationHours,
  hasConflict, isWithinLimits, isWithinBookingWindow, searchableFields,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL      ?? "";
const ME      = window.__CURRENT_MEMBER ?? null;
const EVENTS  = window.__EVENTS_URL  ?? "";

// Best-effort: the row is already written, so a failed publish is not fatal.
async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS) return;
  try {
    await fetch(EVENTS, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, subject_id: subjectId, payload }),
    });
  } catch {
    // ignored on purpose
  }
}

const APP_ID  = window.__APP_ID ?? "amenity-reservations";
// Hub admin flag — distinct from board membership. A hub admin must be able to
// reach the admin view to appoint the board group even before one exists (and
// thus before anyone has board access), otherwise configuration deadlocks.
const IS_ADMIN = window.__IS_ADMIN ?? false;

let members      = [];
let groups       = [];
let settings     = { board_group_id: "" };
let amenities    = [];
let reservations = [];
let reviewMap    = new Map();
let memberMap    = new Map();
let amenityMap   = new Map();
let view         = "amenities";
let searchQ = "";       // in-app search (see logic.js searchableFields)
let selectedAmenity = null;
let detailDate   = todayStr();
let modalEl      = null;

// Booking time-picker state (Outlook-style day grid). bkSlots holds 30-min
// intervals for the open booking modal; bkStartSlot/bkEndSlot are inclusive
// indices into bkSlots for the current selection (-1 = nothing picked).
const BK_DAY_START = 7 * 60;   // 07:00
const BK_DAY_END   = 22 * 60;  // 22:00
let bkSlots      = [];
let bkStartSlot  = -1;
let bkEndSlot    = -1;

// ── Helpers ──────────────────────────────────────────────────────────────────


function addDays(dateStr, n) {
  // Anchored at UTC midnight and stepped with setUTCDate, so the arithmetic is
  // pure calendar arithmetic: `new Date(str + "T12:00:00")` is a LOCAL instant
  // and `toISOString()` then reads it back in UTC, which lands on the wrong day
  // for offsets past ±12h and drifts across a DST boundary.
  const d = new Date(dateStr + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

function fmtDate(d) {
  return new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}

function fmtTime(t) {
  const [h, m] = t.split(":").map(Number);
  return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "PM" : "AM"}`;
}

function amIBoard() { return _isBoard(ME, groups, settings.board_group_id); }

function memberName(id) { return memberMap.get(id)?.name ?? "Unknown"; }

function statusBadge(s) {
  if (s === "confirmed") return `<span class="badge badge-green">Confirmed</span>`;
  if (s === "pending")   return `<span class="badge badge-yellow">Pending Approval</span>`;
  if (s === "cancelled") return `<span class="badge badge-gray">Cancelled</span>`;
  if (s === "denied")    return `<span class="badge badge-red">Denied</span>`;
  return "";
}


// ── DB ────────────────────────────────────────────────────────────────────────

// The SDK helper THROWS on a `{ error }` body. The hand-rolled version this
// replaced returned it, so a write refused by a row policy resolved normally:
// the UI rendered success and every `.catch()` rollback below was dead code.
const db = createDbHelper(DB);

/**
 * Minimal error surface. Every write here is optimistic — the row is added
 * locally and persisted in the background — so a refused write used to leave
 * the optimistic row on screen forever. The `.catch()`es now fire, reload the
 * authoritative state, and say why.
 */
let errorTimer = null;
function showError(err) {
  const message = err?.message || "That change could not be saved.";
  let el = document.getElementById("app-error");
  if (!el) {
    el = document.createElement("div");
    el.id = "app-error";
    el.setAttribute("role", "alert");
    el.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;"
      + "max-width:min(90vw,520px);padding:10px 14px;border-radius:10px;font-size:0.9rem;"
      + "background:var(--danger,#b42318);color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.25)";
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.style.display = "";
  clearTimeout(errorTimer);
  errorTimer = setTimeout(() => { el.style.display = "none"; }, 6000);
}

// ── Demo data ─────────────────────────────────────────────────────────────────

const DEMO_AMENITIES = [
  { id: "d1", name: "Pool", icon: "🏊", location: "Building A", description: "Outdoor heated pool. Open 6 AM–10 PM. Towels not provided.", capacity: 0, booking_window_days: 30, max_duration_hours: 3, min_duration_hours: 0.5, max_per_household_per_month: 8, requires_approval: 0, is_active: 1, created_by: "", created_at: "", updated_at: "" },
  { id: "d2", name: "Clubhouse", icon: "🏛️", location: "Community Center", description: "Seats up to 50. Full kitchen and AV system included. Board approval required for events.", capacity: 1, booking_window_days: 60, max_duration_hours: 8, min_duration_hours: 1, max_per_household_per_month: 2, requires_approval: 1, is_active: 1, created_by: "", created_at: "", updated_at: "" },
  { id: "d3", name: "Tennis Court", icon: "🎾", location: "East Courts", description: "Two courts. Bring your own rackets and balls.", capacity: 2, booking_window_days: 14, max_duration_hours: 2, min_duration_hours: 0.5, max_per_household_per_month: 6, requires_approval: 0, is_active: 1, created_by: "", created_at: "", updated_at: "" },
];

const DEMO_RESERVATIONS = [
  { id: "r1", amenity_id: "d1", reserved_by: "m2", date: todayStr(), start_time: "10:00", end_time: "11:30", guest_count: 0, notes: "", status: "confirmed", reviewed_by: null, reviewed_at: null, created_at: "", updated_at: "" },
  { id: "r2", amenity_id: "d2", reserved_by: "m3", date: addDays(todayStr(), 2), start_time: "14:00", end_time: "18:00", guest_count: 20, notes: "Birthday party", status: "pending", reviewed_by: null, reviewed_at: null, created_at: "", updated_at: "" },
  { id: "r3", amenity_id: "d3", reserved_by: "m1", date: todayStr(), start_time: "08:00", end_time: "09:30", guest_count: 0, notes: "", status: "confirmed", reviewed_by: null, reviewed_at: null, created_at: "", updated_at: "" },
];

// ── Data loading ──────────────────────────────────────────────────────────────

async function loadContext() {
  if (!CONTEXT) {
    members = [
      { id: "m1", name: "Alex Board", role: "adult" },
      { id: "m2", name: "Beth Resident", role: "adult" },
      { id: "m3", name: "Carol Resident", role: "adult" },
    ];
    memberMap = new Map(members.map(m => [m.id, m]));
    groups = [];
    return;
  }
  try {
    const res = await fetch(`${CONTEXT}?keys=family.members,family.groups`);
    const data = await res.json();
    members = data["family.members"] ?? [];
    groups  = data["family.groups"]  ?? [];
  } catch { members = []; groups = []; }
  memberMap = new Map(members.map(m => [m.id, m]));
}

async function loadSettings() {
  // settings is adult_only — a child member's read is rejected (they're never board,
  // so an empty board_group_id is the correct fallback). Guard against a missing
  // rows array so that rejection is non-fatal.
  const r = await db(`SELECT value FROM app_amenity_reservations__settings WHERE key = 'board_group_id' LIMIT 1`);
  settings = { board_group_id: r.rows?.[0]?.value ?? "" };
}

async function loadReviews() {
  if (!DB) { reviewMap = new Map(); return; }
  const r = await db(`SELECT reservation_id, decision, reviewed_by, reviewed_at FROM app_amenity_reservations__reviews`);
  reviewMap = new Map((r.rows ?? []).map(rv => [rv.reservation_id, rv]));
}

// Effective status is derived from the board-only `reviews` table and the amenity's
// approval setting — never trusted from the (self-writable) reservation row, except
// for owner cancellation. This neutralises a member setting their own row to
// "confirmed" to skip board approval.
function effectiveStatus(r) {
  if (r.status === "cancelled") return "cancelled";
  const review = reviewMap.get(r.id);
  if (review) return review.decision;            // board confirmed / denied
  const a = amenityMap.get(r.amenity_id);
  if (a && a.requires_approval) return "pending";
  return "confirmed";                            // instant-booking amenity
}

// Fold the derived status into the in-memory rows so existing render/conflict/limit
// logic keeps reading `r.status`.
function applyEffectiveStatus() {
  for (const r of reservations) r.status = effectiveStatus(r);
}

async function loadAmenities() {
  if (!DB) { amenities = DEMO_AMENITIES; amenityMap = new Map(amenities.map(a => [a.id, a])); return; }
  const r = await db(
    `SELECT * FROM app_amenity_reservations__amenities ORDER BY name`
  );
  amenities = r.rows;
  amenityMap = new Map(amenities.map(a => [a.id, a]));
}

async function loadReservations() {
  if (!DB) { reservations = DEMO_RESERVATIONS; return; }
  const cutoff = addDays(todayStr(), -30);
  const r = await db(
    `SELECT * FROM app_amenity_reservations__reservations WHERE date >= ? ORDER BY date, start_time`,
    [cutoff]
  );
  reservations = r.rows;
}

// ── Render ────────────────────────────────────────────────────────────────────

// render() rewrites the whole shell, so put the caret back after typing.
document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  const caret = e.target.selectionStart;
  render();
  const next = document.getElementById("search");
  if (next) { next.focus(); next.setSelectionRange(caret, caret); }
});

function render() {
  applyEffectiveStatus();
  const board = amIBoard();
  const pendingCount = reservations.filter(r => r.status === "pending").length;
  document.getElementById("root").innerHTML = `
    ${renderHeader(board)}
    ${renderTabs(board, pendingCount)}
    ${view === "amenities" ? renderAmenities(board)
    : view === "detail"   ? renderDetail(board)
    : view === "mine"     ? renderMine()
    : view === "all"      ? renderAll()
    : view === "pending"  ? renderPendingView()
    : view === "admin"    ? renderAdmin(board)
    : ""}
  `;
}

function renderHeader(board) {
  return `<header>
    <div>
      <h1>🏘️ Amenity Reservations</h1>
      ${board ? `<div class="sub">Board access</div>` : ""}
    </div>
    ${(board || IS_ADMIN) ? `<button class="btn-icon" onclick="setView('admin')" title="${board ? "Manage amenities" : "Board settings"}">⚙️</button>` : ""}
  </header>`;
}

function renderTabs(board, pendingCount) {
  const t = (label, v, badge = 0) =>
    `<button class="tab ${view === v || (v === "amenities" && view === "detail") ? "active" : ""}" data-testid="tab" data-tab-id="${esc(v)}" onclick="setView('${v}')">
       ${esc(label)}${badge ? `<span class="badge-count">${badge}</span>` : ""}
     </button>`;
  return `<div class="tabs">
    ${t("Amenities", "amenities")}
    ${t("My Bookings", "mine")}
    ${board ? t("All", "all") : ""}
    ${board ? t("Pending", "pending", pendingCount) : ""}
  </div>`;
}

// ── View: Amenities grid ──────────────────────────────────────────────────────

function renderAmenities(board) {
  const all = amenities.filter(a => a.is_active || board);
  if (!all.length) {
    return `<div class="empty">No amenities configured yet.${board ? "<br>Use ⚙️ to add one." : ""}</div>`;
  }
  const searchRow = `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search amenities…" aria-label="Search amenities" value="${esc(searchQ)}" /></div>`;
  const visible = searchQ ? all.filter(a => searchMatch(searchQ, searchableFields(a))) : all;
  if (!visible.length) {
    return `${searchRow}<div class="empty">No amenities match "${esc(searchQ)}".</div>`;
  }
  const today = todayStr();
  // Pre-index today's active reservations by amenity_id — O(n) once instead of O(n) per card
  const todayResMap = new Map();
  for (const r of reservations) {
    if (r.date === today && (r.status === "confirmed" || r.status === "pending")) {
      if (!todayResMap.has(r.amenity_id)) todayResMap.set(r.amenity_id, []);
      todayResMap.get(r.amenity_id).push(r);
    }
  }
  return `${searchRow}<div class="amenity-grid">${visible.map(a => {
    const todayRes = todayResMap.get(a.id) ?? [];
    let availHtml;
    if (!a.is_active) {
      availHtml = `<div class="amenity-avail" style="color:var(--muted)">Inactive</div>`;
    } else if (a.capacity === 0) {
      availHtml = todayRes.length
        ? `<div class="amenity-avail avail-full">Booked today</div>`
        : `<div class="amenity-avail avail-ok">✓ Available today</div>`;
    } else if (todayRes.length >= a.capacity) {
      availHtml = `<div class="amenity-avail avail-full">Full today</div>`;
    } else if (todayRes.length > 0) {
      availHtml = `<div class="amenity-avail avail-limited">${todayRes.length}/${esc(a.capacity)} slots booked</div>`;
    } else {
      availHtml = `<div class="amenity-avail avail-ok">✓ Available today</div>`;
    }
    return `<div class="amenity-card" data-testid="amenity-card" data-amenity-id="${esc(a.id)}" data-amenity-active="${a.is_active ? "1" : "0"}" data-act="openDetail" data-id="${esc(a.id)}">
      <div class="amenity-icon">${esc(a.icon)}</div>
      <div class="amenity-name">${esc(a.name)}</div>
      ${a.location ? `<div class="amenity-loc">📍 ${esc(a.location)}</div>` : ""}
      ${availHtml}
    </div>`;
  }).join("")}</div>`;
}

// ── Booking time picker (Outlook-style day grid) ───────────────────────────────

/** "HH:MM" for a minutes-since-midnight value. */
function minToTime(mn) {
  return `${String(Math.floor(mn / 60)).padStart(2, "0")}:${String(mn % 60).padStart(2, "0")}`;
}

/** Human duration, e.g. 0.5 → "30 min", 1 → "1 hr", 1.5 → "1.5 hrs". */
function fmtDur(h) {
  if (h < 1) return `${Math.round(h * 60)} min`;
  return `${h} hr${h === 1 ? "" : "s"}`;
}

/**
 * Builds the day's 30-min slots for `a` on `date`, marking occupancy.
 * A slot is `full` when single-occupancy and any reservation overlaps, or
 * when multi-occupancy and all concurrent slots are taken.
 */
function bkBuildSlots(a, date) {
  const res = reservations.filter(r =>
    r.amenity_id === a.id && r.date === date &&
    r.status !== "cancelled" && r.status !== "denied");
  const out = [];
  for (let mn = BK_DAY_START; mn < BK_DAY_END; mn += 30) {
    const start = mn, end = mn + 30;
    const overlap = res.filter(r =>
      timesToMinutes(r.start_time) < end && timesToMinutes(r.end_time) > start);
    const occ  = overlap.length;
    const full = a.capacity === 0 ? occ >= 1 : occ >= a.capacity;
    out.push({ start, end, occ, full, overlap });
  }
  return out;
}

/** Pre-selects a sensible default window (min-duration starting at 9 AM if free). */
function bkPickDefault(a) {
  const idx = bkSlots.findIndex(s => s.start === 9 * 60);
  if (idx < 0 || bkSlots[idx].full) return;
  const need = Math.max(1, Math.round((a.min_duration_hours * 60) / 30));
  let end = idx;
  for (let k = idx; k < idx + need && k < bkSlots.length; k++) {
    if (bkSlots[k].full) break;
    end = k;
  }
  bkStartSlot = idx;
  bkEndSlot = end;
}

    <div class="form-group">

        min="${esc(todayStr())}" max="${esc(addDays(todayStr(), a.booking_window_days))}"
        onchange="rebuildBkGrid()" />
    </div>
    <div class="form-group">
      <label>Time</label>
      <div class="bk-pick-hint">
        <span style="font-size:.78rem;color:var(--muted)">Tap a start, then an end time.</span>
        <button type="button" class="link-btn" onclick="clearBkSelection()">Clear</button>
      </div>

      <div id="bk-grid" class="bk-grid"></div>
      <input type="hidden" id="bk-start" />
      <input type="hidden" id="bk-end" />
    </div>
    ${a.capacity > 0 ? `<div class="form-group"><label>Number of Guests</label><input type="number" id="bk-guests" value="0" min="0" max="500" /></div>` : ""}
    <div class="form-group">

/** Rebuilds the slot grid for the modal's current date and resets selection. */
window.rebuildBkGrid = function() {
  const a = selectedAmenity;
  if (!a) return;
  const date = document.getElementById("bk-date")?.value || detailDate;
  bkSlots = bkBuildSlots(a, date);
  bkStartSlot = -1;
  bkEndSlot = -1;
  bkPickDefault(a);
  renderBkGrid();
  syncBkSelection();
};

/** Handles a tap on slot `i`: starts, extends, or shrinks the selection. */
window.pickBkSlot = function(i) {
  const slot = bkSlots[i];
  if (!slot || slot.full) return;
  if (bkStartSlot < 0) {
    bkStartSlot = bkEndSlot = i;
  } else if (i > bkEndSlot) {
    // Extend downward, clamping before the first full slot in the way.
    let j = i;
    for (let k = bkEndSlot + 1; k <= i; k++) { if (bkSlots[k].full) { j = k - 1; break; } }
    bkEndSlot = j;
  } else if (i < bkStartSlot) {
    // Extend upward, clamping after the nearest full slot above.
    let j = i;
    for (let k = bkStartSlot - 1; k >= i; k--) { if (bkSlots[k].full) { j = k + 1; break; } }
    bkStartSlot = j;
  } else {
    // Tap inside the selection trims the tail.
    bkEndSlot = i;
  }
  renderBkGrid();
  syncBkSelection();
};

window.clearBkSelection = function() {
  bkStartSlot = -1;
  bkEndSlot = -1;
  renderBkGrid();
  syncBkSelection();
};

/** Renders the slot rows reflecting occupancy and the current selection. */
function renderBkGrid() {
  const grid = document.getElementById("bk-grid");
  if (!grid) return;
  const a = selectedAmenity;
  grid.innerHTML = bkSlots.map((s, i) => {
    const inSel = bkStartSlot >= 0 && i >= bkStartSlot && i <= bkEndSlot;
    let cls, body = "";
    if (s.full) {
      cls = "full";
      const runStart = i === 0 || !bkSlots[i - 1].full;
      if (runStart) {
        const who = s.overlap.length ? memberName(s.overlap[0].reserved_by) : "Reserved";
        const extra = a.capacity > 0 ? ` · full (${s.occ}/${a.capacity})` : "";
        body = `<span>${esc(who)}${esc(extra)}</span>`;
      }
    } else if (inSel) {
      cls = "sel";
      if (i === bkStartSlot) body = `<span>Your reservation</span>`;
    } else if (a.capacity > 0 && s.occ > 0) {
      cls = "partial";
      const runStart = i === 0 || bkSlots[i - 1].full || bkSlots[i - 1].occ === 0;
      if (runStart) body = `<span>${s.occ}/${esc(a.capacity)} booked</span>`;
    } else {
      cls = "free";
    }
    return `<button type="button" class="bk-slot ${cls}" ${s.full ? "disabled" : `onclick="pickBkSlot(${i})"`}>
      <span class="bk-slot-time">${esc(fmtTime(minToTime(s.start)))}</span>
      <span class="bk-slot-body">${body}</span>
    </button>`;
  }).join("");
}

/** Mirrors the selection into the hidden inputs, readout, and Book button state. */
function syncBkSelection() {
  const a = selectedAmenity;
  const startInput = document.getElementById("bk-start");
  const endInput   = document.getElementById("bk-end");
  const readout    = document.getElementById("bk-readout");
  const bookBtn    = document.getElementById("bk-submit");
  if (!startInput || !endInput || !readout) return;

  if (bkStartSlot < 0) {
    startInput.value = "";
    endInput.value = "";
    readout.className = "bk-readout muted";
    readout.textContent = "Tap a free time to start your reservation.";
    if (bookBtn) bookBtn.disabled = true;
    return;
  }

  const startMin = bkSlots[bkStartSlot].start;
  const endMin   = bkSlots[bkEndSlot].end;
  startInput.value = minToTime(startMin);
  endInput.value   = minToTime(endMin);

  const dur = (endMin - startMin) / 60;
  let ok = true, note = "";
  if (dur < a.min_duration_hours)      { ok = false; note = ` — minimum ${fmtDur(a.min_duration_hours)}`; }
  else if (dur > a.max_duration_hours) { ok = false; note = ` — maximum ${fmtDur(a.max_duration_hours)}`; }

  readout.className = ok ? "bk-readout ok" : "bk-readout bad";
  readout.textContent = `${fmtTime(minToTime(startMin))} – ${fmtTime(minToTime(endMin))} · ${fmtDur(dur)}${note}`;
  if (bookBtn) bookBtn.disabled = !ok;
}

window.submitBooking = async function() {
  const a = selectedAmenity;
  if (!a || !ME) return;

  const date      = document.getElementById("bk-date")?.value ?? "";
  const startTime = document.getElementById("bk-start")?.value ?? "";
  const endTime   = document.getElementById("bk-end")?.value ?? "";
  const guests    = parseInt(document.getElementById("bk-guests")?.value ?? "0", 10) || 0;
  const notes     = document.getElementById("bk-notes")?.value.trim() ?? "";
  const errorEl   = document.getElementById("bk-error");

  function showErr(msg) { if (errorEl) errorEl.textContent = msg; }

  if (!date || !startTime || !endTime) { showErr("Please fill in all required fields."); return; }
  if (startTime >= endTime)            { showErr("End time must be after start time."); return; }

  const dur = durationHours(startTime, endTime);
  if (dur < a.min_duration_hours) { showErr(`Minimum booking duration is ${a.min_duration_hours} hr${a.min_duration_hours !== 1 ? "s" : ""}.`); return; }
  if (dur > a.max_duration_hours) { showErr(`Maximum booking duration is ${a.max_duration_hours} hr${a.max_duration_hours !== 1 ? "s" : ""}.`); return; }
  if (!isWithinBookingWindow(date, a.booking_window_days, todayStr())) { showErr("That date is outside the booking window."); return; }

  const amenityResForDate = reservations.filter(r => r.amenity_id === a.id && r.date === date);
  if (hasConflict(startTime, endTime, amenityResForDate, a.capacity)) {
    showErr("That time slot is not available. Please choose a different time.");
    return;
  }
  if (!isWithinLimits(ME.id, a.id, date, reservations, a.max_per_household_per_month)) {
    showErr(`You've reached the ${a.max_per_household_per_month} reservation/month limit for this amenity.`);
    return;
  }

  const id     = crypto.randomUUID();
  const now    = new Date().toISOString();
  // Effective status is derived (see effectiveStatus); the stored value is only a
  // hint and is ignored for approval-required amenities until the board reviews.
  const status = a.requires_approval ? "pending" : "confirmed";

  // Optimistic update — add to local state and close modal immediately
  reservations.push({ id, amenity_id: a.id, reserved_by: ME.id, date, start_time: startTime,
    end_time: endTime, guest_count: guests, notes, status, created_at: now, updated_at: now,
    reviewed_by: null, reviewed_at: null });
  closeModal();
  render();

  // Persist in the background. reserved_by is forced server-side by the row policy.
  db(
    `INSERT INTO app_amenity_reservations__reservations (id, amenity_id, reserved_by, date, start_time, end_time, guest_count, notes, status, created_at, updated_at)
     VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
    [id, a.id, ME.id, date, startTime, endTime, guests, notes, status, now, now]
  ).catch((e) => { showError(e); reloadReservations(); });

  // Reservations default to visibility 'everyone' - the amenity calendar is a
  // shared community board - so the bus audience matches the row policy.
  publishEvent("amenity.reserved", id, {
    amenity_id: a.id,
    amenity: a.name,
    date,
    start_time: startTime,
    end_time: endTime,
    reserved_by: ME.id,
    status,
  });

  if (status === "pending") {
    fetch(window.__NOTIFY_URL ?? "/api/notifications/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: "Reservation Request",
        body: `${ME.name} requested ${a.name} on ${fmtDate(date)} (${fmtTime(startTime)}–${fmtTime(endTime)})`,
        url: `/run/${APP_ID}?view=pending`,
        audience: "adults",
      }),
    }).catch(() => {});
  }

  // No activity-feed write here. /api/activity accepts only the hub's own
  // closed ActivityType union (CALLER_ALLOWED_ACTIVITY_TYPES); "amenity_reserved"
  // is not in it, so this POSTed a 403 on every reservation and no household
  // ever saw the entry — a fetch does not reject on 4xx, so the .catch() hid it.
  // The amenity.reserved event published above is the sink that works.
};

window.cancelReservation = async function(id) {
  const ok = await hubConfirm({ message: "Cancel this reservation?", confirmLabel: "Cancel Reservation", destructive: true });
  if (!ok) return;
  const now = new Date().toISOString();
  const r = reservations.find(x => x.id === id);
  if (r) { r.status = "cancelled"; r.updated_at = now; }
  render();
  // Owner-scoped by the row policy: a member can only cancel their own reservation
  // (the board may cancel any via the board-group bypass).
  db(`UPDATE app_amenity_reservations__reservations SET status = 'cancelled', updated_at = ? WHERE id = ?`,
    [now, id]
  ).catch((e) => { showError(e); reloadReservations(); });
};

// ── Board approval actions ────────────────────────────────────────────────────
// Decisions are written to the board-only `reviews` table (insert_privileged_only):
// only members of the configured board group may insert, so a member cannot
// approve/deny their own (or anyone's) reservation by writing the reservation row.

async function recordReview(id, decision) {
  if (!ME) return;
  const now = new Date().toISOString();
  reviewMap.set(id, { reservation_id: id, decision, reviewed_by: ME.id, reviewed_at: now });
  applyEffectiveStatus();
  render();
  return db(
    `INSERT OR REPLACE INTO app_amenity_reservations__reviews (reservation_id, decision, reviewed_by, reviewed_at) VALUES (?, ?, ?, ?)`,
    [id, decision, ME.id, now]
  ).catch((e) => { showError(e); reloadReservations(); });
}

window.approveReservation = async function(id) {
  if (!ME) return;
  const r = reservations.find(x => x.id === id);
  if (!r) return;
  const a = amenityMap.get(r.amenity_id);
  fetch(window.__NOTIFY_URL ?? "/api/notifications/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      title: "Reservation Approved",
      body: `Your ${a?.name ?? "reservation"} on ${fmtDate(r.date)} (${fmtTime(r.start_time)}–${fmtTime(r.end_time)}) has been approved.`,
      url: `/run/${APP_ID}?view=mine`,
    }),
  }).catch(() => {});
  await recordReview(id, "confirmed");
};

window.denyReservation = async function(id) {
  const ok = await hubConfirm({ message: "Deny this reservation request?", confirmLabel: "Deny", destructive: true });
  if (!ok) return;
  if (!ME) return;
  const r = reservations.find(x => x.id === id);
  if (!r) return;
  const a = amenityMap.get(r.amenity_id);
  fetch(window.__NOTIFY_URL ?? "/api/notifications/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      title: "Reservation Not Approved",
      body: `Your request for ${a?.name ?? "a reservation"} on ${fmtDate(r.date)} was not approved.`,
      url: `/run/${APP_ID}?view=mine`,
    }),
  }).catch(() => {});
  await recordReview(id, "denied");
};

window.submitAmenity = async function(existingId) {
  const name     = document.getElementById("am-name")?.value.trim() ?? "";
  const icon     = document.getElementById("am-icon")?.value ?? "🏛️";
  const loc      = document.getElementById("am-loc")?.value.trim() ?? "";
  const desc     = document.getElementById("am-desc")?.value.trim() ?? "";
  const minDur   = parseFloat(document.getElementById("am-min")?.value) || 0.5;
  const maxDur   = parseFloat(document.getElementById("am-max")?.value) || 4;
  const cap      = parseInt(document.getElementById("am-cap")?.value, 10) || 0;
  const win      = parseInt(document.getElementById("am-win")?.value, 10) || 30;
  const limit    = parseInt(document.getElementById("am-limit")?.value, 10) || 0;
  const approval = document.getElementById("am-approval")?.checked ? 1 : 0;
  const errorEl  = document.getElementById("am-error");

  if (!name) { if (errorEl) errorEl.textContent = "Name is required."; document.getElementById("am-name")?.focus(); return; }
  if (minDur > maxDur) { if (errorEl) errorEl.textContent = "Min duration cannot exceed max duration."; return; }

  const now = new Date().toISOString();
  let bgCall;
  if (existingId) {
    const updated = { ...amenityMap.get(existingId), name, icon, location: loc, description: desc,
      min_duration_hours: minDur, max_duration_hours: maxDur, capacity: cap,
      booking_window_days: win, max_per_household_per_month: limit, requires_approval: approval, updated_at: now };
    const idx = amenities.findIndex(a => a.id === existingId);
    if (idx !== -1) amenities[idx] = updated;
    amenityMap.set(existingId, updated);
    if (selectedAmenity?.id === existingId) selectedAmenity = updated;
    bgCall = db(
      `UPDATE app_amenity_reservations__amenities SET name=?, icon=?, location=?, description=?, min_duration_hours=?, max_duration_hours=?, capacity=?, booking_window_days=?, max_per_household_per_month=?, requires_approval=?, updated_at=? WHERE id=?`,
      [name, icon, loc, desc, minDur, maxDur, cap, win, limit, approval, now, existingId]
    );
  } else {
    const id = crypto.randomUUID();
    const newAmenity = { id, name, icon, location: loc, description: desc, min_duration_hours: minDur,
      max_duration_hours: maxDur, capacity: cap, booking_window_days: win,
      max_per_household_per_month: limit, requires_approval: approval, is_active: 1,
      created_by: ME?.id ?? "", created_at: now, updated_at: now };
    amenities.push(newAmenity);
    amenityMap.set(id, newAmenity);
    bgCall = db(
      `INSERT INTO app_amenity_reservations__amenities (id, name, icon, location, description, min_duration_hours, max_duration_hours, capacity, booking_window_days, max_per_household_per_month, requires_approval, is_active, created_by, created_at, updated_at)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 1, ?, ?, ?)`,
      [id, name, icon, loc, desc, minDur, maxDur, cap, win, limit, approval, ME?.id ?? "", now, now]
    );
  }
  closeModal();
  render();
  bgCall.catch((e) => { showError(e); loadAmenities().then(render); });
};

window.toggleActive = async function(id, currentlyActive) {
  const newVal = currentlyActive ? 0 : 1;
  const now    = new Date().toISOString();
  const a = amenityMap.get(id);
  if (a) { a.is_active = newVal; a.updated_at = now; }
  render();
  db(`UPDATE app_amenity_reservations__amenities SET is_active=?, updated_at=? WHERE id=?`,
    [newVal, now, id]
  ).catch((e) => { showError(e); loadAmenities().then(render); });
};

window.saveBoardGroup = async function(groupId) {
  settings.board_group_id = groupId;
  render();
  // settings is app_config — writes must go through the admin-config hub endpoint, not /api/db.
  fetch(`/run/${APP_ID}/api/admin-config`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key: "board_group_id", value: groupId }),
  }).catch(() => {});
};

// ── Modal ─────────────────────────────────────────────────────────────────────

function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}
function closeModal() { modalEl?.remove(); modalEl = null; }
window.closeModal = closeModal;

// ── Event delegation ──────────────────────────────────────────────────────────
// Actions that carry a DB-derived id (reservation/amenity id, chosen by whoever
// INSERTed the row via raw /api/db) are dispatched via data-* attributes instead
// of inline onclick handlers. HTML-escaping is not sufficient inside an inline
// JS-string-in-attribute context — after attribute decoding the value re-enters a
// script context — so ids must never be interpolated into onclick. Covers both
// #root and the modal (appended to <body>).
document.body.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case "openDetail":    window.openDetail(id); break;
    case "editAmenity":   window.openAmenityModal(id || null); break;
    case "cancel":        window.cancelReservation(id); break;
    case "approve":       window.approveReservation(id); break;
    case "deny":          window.denyReservation(id); break;
    case "toggleActive":  window.toggleActive(id, el.dataset.active === "1" ? 1 : 0); break;
    case "submitAmenity": window.submitAmenity(id ?? ""); break;
  }
});

// ── Deep link ─────────────────────────────────────────────────────────────────

function handleDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const v = params.get("view");
  const VALID_VIEWS = ["amenities", "mine", "all", "pending", "admin"];
  if (v && VALID_VIEWS.includes(v)) view = v;
}

// ── Init ──────────────────────────────────────────────────────────────────────

async function reloadReservations() {
  await Promise.all([loadReservations(), loadReviews()]);
  applyEffectiveStatus();
  render();
}

(async () => {
  await Promise.all([loadContext(), loadSettings(), loadAmenities(), loadReservations(), loadReviews()]);
  applyEffectiveStatus();
  handleDeepLink();
  render();
})();
